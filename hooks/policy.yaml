# Gate policy (FK2). policy_version in L2 records = sha256 of this file.
# Protected path: changes require human approval (CLAUDE.md).

action_classes:
  Read: read
  Glob: read
  Grep: read
  NotebookRead: read
  Write: write
  Edit: edit
  NotebookEdit: write
  Bash: execute
  WebFetch: send
  WebSearch: send

# Tool-name substrings classed as sends (outbound-content scan mandatory, AT-6)
send_tool_markers: [send, post, message, mail, publish, upload, share]

# Writes here require human approval (verdict: ask). Matched on the RESOLVED
# real path (symlinks can't dodge). Relative entries match anywhere in the
# resolved path; ~//absolute entries match by prefix.
protected_paths:
  - hooks/
  - adapter/
  - CLAUDE.md
  - .github/workflows/
  - docs/team-os-fork-harness-native.md   # divergence log — append via PR only
  - config/envelope-policy.json           # envelope ceiling — script can never touch its own ceiling
  - envelope-state.json                   # the dial — agent can't widen its own envelope
  - breaker.json                          # the stop — agent can't disarm the kill switch
  - .claude/settings.json                 # hook registration — gate can't be unplugged at source
  - ~/.claude/settings.json

# Reads of these escalate (verdict: ask)
sensitive_read_paths:
  - .ssh/
  - .claude.json
  - .aws/
  - .gnupg/
  - .env
  - id_rsa
  - credentials

# Writes under declared cloud-synced roots are SENDS, not local writes (FR2).
# Matched as substrings of the target path AND of Bash commands.
synced_paths:
  - Library/Mobile Documents
  - Library/CloudStorage
  - Dropbox
  - Google Drive
  - GoogleDrive-          # modern macOS Drive mount: GoogleDrive-<email>
  - OneDrive
  - /Box/
  - /Box Sync

# Bash egress markers. Matched against a NORMALIZED command: quote/escape
# chars stripped, whitespace collapsed, casefolded — so cu"r"l, CURL, cu\rl
# all match. Substring denylist = interim defense-in-depth only; the
# defensible layer is taint + send gate (see BEHAVIOR.md).
egress_patterns:
  - curl
  - wget
  - "nc "
  - ncat
  - netcat
  - scp
  - sftp
  - "ssh "
  - rsync
  - "git push"
  - "dig "
  - nslookup
  - osascript
  - "open http"
  - /dev/tcp
  - /dev/udp
  - import socket
  - socket.socket
  - base64

# Outbound-content scan (mandatory on every send — X-2: catches VERBATIM
# secrets/identifiers only; paraphrase-exfil is carried by taint + send gate)
secret_patterns:
  - "AKIA[0-9A-Z]{16}"
  - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
  - "ghp_[A-Za-z0-9]{20,}"
  - "sk-ant-[A-Za-z0-9-]{20,}"
  - "xox[bap]-[A-Za-z0-9-]{10,}"
  - "eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+"   # JWT: header.payload, both base64url of a JSON object ({"...)

# --- taint (FR2 Layer A, session-granular, fork §7.7) ---
# Reading any of these marks the session tainted: subsequent sends/schedules
# require confirmation (untrusted content supplies values, never plan structure)
taint_source_paths:
  - stores/corpus
  - stores/skills
  - inbox/
taint_source_tools:
  - WebFetch
  - WebSearch
